# ========================================================
# UC17 - Spring Boot Application Configuration (Production)
# ========================================================

# --- Application Name ---
spring.application.name=quantity-measurement-app

# --- MySQL Database Configuration (Production) ---
spring.datasource.url=jdbc:mysql://localhost:3306/quantitymeasurementdb?useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Connection Pool Configuration ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# --- Logging Configuration ---
logging.level.root=WARN
logging.level.com.app.quantitymeasurement=INFO

# --- Swagger / OpenAPI Configuration ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# --- Actuator Configuration ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# --- Server Configuration ---
server.port=8080
