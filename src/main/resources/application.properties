# Application Configuration for Quantity Measurement App
# UC16 - Database Integration

# --- Repository Configuration ---
# Options: cache, database
repository.type=database

# --- H2 Database Configuration ---
db.url=jdbc:h2:mem:quantitymeasurement;DB_CLOSE_DELAY=-1
db.driver=org.h2.Driver
db.username=sa
db.password=

# --- Connection Pool Configuration ---
db.pool.size=5
db.pool.timeout=30000

# --- Logging Configuration ---
logging.level=INFO
